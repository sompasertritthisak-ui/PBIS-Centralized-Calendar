/* -------------------------------------------------- OCCURRENCE ENGINE ---- */
/**
 * Expand a canonical event record into concrete day occurrences within a range.
 * Handles: single-day, multi-day spans, and weekly/daily/monthly recurrence.
 * Returns light objects: {ev, date, isStart, isEnd, spanIndex, spanLen}
 */
function expand(ev, from, to){
  const out = [];
  const push = (startKey) => {
    const len = ev.endDate ? Math.max(1, T.diffDays(ev.date, ev.endDate)+1) : 1;
    for(let i=0;i<len;i++){
      const d = T.addDays(startKey, i);
      if(d>=from && d<=to) out.push({ev, date:d, isStart:i===0, isEnd:i===len-1, spanIndex:i, spanLen:len});
    }
  };
  const r = ev.recurrence;
  if(!r){ push(ev.date); return out; }

  const until = r.until || r.count ? (r.until || to) : to;
  const hardStop = (until < to ? until : to);
  let guard = 0;

  if(r.freq==='weekly'){
    const days = (r.byday && r.byday.length) ? r.byday : [T.dow(ev.date)];
    const interval = r.interval||1;
    const anchorWeek = T.startOfWeek(ev.date);
    let wk = T.startOfWeek(from < ev.date ? ev.date : from);
    // align to interval
    const weeksFromAnchor = Math.round(T.diffDays(anchorWeek, wk)/7);
    if(weeksFromAnchor % interval !== 0) wk = T.addDays(wk, (interval - (weeksFromAnchor % interval))*7);
    while(wk <= hardStop && guard++ < 400){
      days.forEach(dw=>{
        const offset = dw===0 ? 6 : dw-1;      // Monday-start week
        const d = T.addDays(wk, offset);
        if(d>=ev.date && d<=hardStop && d>=from && d<=to) push(d);
      });
      wk = T.addDays(wk, 7*interval);
    }
  } else if(r.freq==='daily'){
    const interval=r.interval||1;
    let d = ev.date;
    while(d<=hardStop && guard++<800){ if(d>=from&&d<=to) push(d); d=T.addDays(d,interval); }
  } else if(r.freq==='monthly'){
    const interval=r.interval||1;
    let d = ev.date;
    while(d<=hardStop && guard++<200){ if(d>=from&&d<=to) push(d); d=T.addMonths(d,interval); }
  } else if(r.freq==='yearly'){
    let d = ev.date;
    while(d<=hardStop && guard++<40){ if(d>=from&&d<=to) push(d); d=T.addMonths(d,12); }
  } else {
    push(ev.date);
  }
  return out;
}

/* -------------------------------------------------------- VISIBILITY ---- */
function visibleTo(ev, role){
  if(ev.status==='archived') return role==='super'||role==='caladmin';
  if(ev.status==='draft') return ['super','caladmin','campusadmin'].includes(role);
  if(ev.visibility==='public') return true;
  if(ev.visibility==='internal') return ['super','caladmin','campusadmin','teacher','student','parent'].includes(role);
  if(ev.visibility==='restricted') return ['super','caladmin','campusadmin'].includes(role);
  return false;
}

/* ------------------------------------------------------------ QUERY ----- */
/**
 * Query occurrences for a date range applying filters + personalisation.
 * opts: {from,to,filters,personalise,includeDrafts,role}
 */
function query(opts){
  const st = Store.state;
  const role = opts.role || Store.user().role;
  const f = opts.filters || st.ui.filters;
  const from = opts.from, to = opts.to;
  const p = st.prefs;
  const usePersonal = !!opts.personalise && p.onboarded;

  let occ = [];
  st.events.forEach(ev=>{
    if(!opts.includeArchived && ev.status==='archived') return;
    if(!opts.includeDrafts && ev.status==='draft' && !['super','caladmin','campusadmin'].includes(role)) return;
    if(!visibleTo(ev, role)) return;
    if(!matchFilters(ev, f)) return;
    if(usePersonal && !matchPersonal(ev, p)) return;
    occ = occ.concat(expand(ev, from, to));
  });
  occ.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1
    : (a.ev.allDay?0:1)-(b.ev.allDay?0:1) || T.toMin(a.ev.start||'00:00')-T.toMin(b.ev.start||'00:00')
    || a.ev.title.localeCompare(b.ev.title));
  return occ;
}

function matchFilters(ev, f){
  if(!f) return true;
  if(f.campusIds && f.campusIds.length){
    // null campus = whole school, always relevant
    if(ev.campusId && !f.campusIds.includes(ev.campusId)) return false;
  }
  if(f.yearGroupIds && f.yearGroupIds.length){
    if(ev.yearGroupIds && ev.yearGroupIds.length && !ev.yearGroupIds.some(y=>f.yearGroupIds.includes(y))) return false;
  }
  if(f.categoryIds && f.categoryIds.length && !f.categoryIds.includes(ev.categoryId)) return false;
  if(f.audienceIds && f.audienceIds.length){
    if(!(ev.audienceIds||[]).some(a=>f.audienceIds.includes(a) || a==='community')) return false;
  }
  if(f.statuses && f.statuses.length && !f.statuses.includes(ev.status)) return false;
  if(f.important && !ev.important) return false;
  if(f.q && f.q.trim()){
    const q = f.q.toLowerCase();
    const loc = byId(LOCATIONS, ev.locationId); const cam = byId(CAMPUSES, ev.campusId);
    const cat = byId(CATEGORIES, ev.categoryId); const org = byId(USERS, ev.organizerId);
    const ygs = (ev.yearGroupIds||[]).map(id=>{const y=byId(YEAR_GROUPS,id); return y?y.name:'';}).join(' ');
    const hay = [ev.title, ev.description, loc&&loc.name, cam&&cam.name, cat&&cat.name, org&&org.name, ygs, ev.date].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

/** My PBIS Calendar relevance rule (section 15 of the brief). */
function matchPersonal(ev, p){
  // Whole-school events always show
  const wholeSchool = !ev.campusId && (!ev.yearGroupIds || !ev.yearGroupIds.length);
  if(wholeSchool) return true;

  if(p.campusId){
    if(ev.campusId && ev.campusId !== p.campusId) return false;
  }
  if(p.yearGroupId){
    const ygs = ev.yearGroupIds||[];
    // campus-wide events (no year groups) are kept; year-specific must match
    if(ygs.length && !ygs.includes(p.yearGroupId)) return false;
  }
  if(p.audienceId){
    const auds = ev.audienceIds||[];
    // A parent needs to see what affects their child, so student-facing events count too.
    // Teachers and staff see the full internal picture.
    const ACCEPT = {
      parents:['parents','students','community'],
      students:['students','community'],
      teachers:['teachers','staff','leadership','students','community'],
      staff:['staff','teachers','leadership','community'],
      leadership:['leadership','staff','teachers','parents','students','community']
    }[p.audienceId] || [p.audienceId,'community'];
    if(auds.length && !auds.some(a=>ACCEPT.includes(a))) return false;
  }
  if(p.categoryIds && p.categoryIds.length){
    // holidays and whole-school academic markers always survive category filtering
    if(!p.categoryIds.includes(ev.categoryId) && !['holiday'].includes(ev.categoryId)) return false;
  }
  return true;
}

/* ----------------------------------------------------- CONFLICT CHECK --- */
function findConflicts(candidate, ignoreId){
  if(!candidate.locationId || candidate.allDay) return [];
  const out = [];
  const cs = T.toMin(candidate.start||'00:00'), ce = T.toMin(candidate.end||'23:59');
  const dates = candidate.endDate ? T.range(candidate.date, candidate.endDate) : [candidate.date];
  Store.state.events.forEach(ev=>{
    if(ev.id===ignoreId) return;
    if(ev.locationId!==candidate.locationId) return;
    if(['cancelled','archived','draft'].includes(ev.status)) return;
    if(ev.allDay) return;
    const occ = expand(ev, dates[0], dates[dates.length-1]);
    occ.forEach(o=>{
      const es=T.toMin(ev.start||'00:00'), ee=T.toMin(ev.end||'23:59');
      if(cs < ee && es < ce) out.push({event:ev, date:o.date});
    });
  });
  return out;
}

/** All location double-bookings currently in the calendar (admin dashboard). */
function allConflicts(){
  const map = new Map(); const out=[];
  const from = T.todayKey(), to = T.addDays(from, 300);
  Store.state.events.forEach(ev=>{
    if(!ev.locationId || ev.allDay || ['cancelled','archived','draft'].includes(ev.status)) return;
    expand(ev, from, to).forEach(o=>{
      const key = ev.locationId+'|'+o.date;
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(ev);
    });
  });
  map.forEach((list,key)=>{
    if(list.length<2) return;
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a=list[i],b=list[j];
      const as=T.toMin(a.start||'0:00'),ae=T.toMin(a.end||'23:59'),bs=T.toMin(b.start||'0:00'),be=T.toMin(b.end||'23:59');
      if(as<be && bs<ae) out.push({a,b,date:key.split('|')[1],locationId:key.split('|')[0]});
    }
  });
  return out;
}

/* ------------------------------------------------------- FEED BUILDERS -- */
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function fold(line){
  if(line.length<=74) return line;
  const parts=[]; let s=line;
  parts.push(s.slice(0,74)); s=s.slice(74);
  while(s.length){ parts.push(' '+s.slice(0,73)); s=s.slice(73); }
  return parts.join('\r\n');
}
function eventToVEVENT(ev){
  const L=[];
  const loc = byId(LOCATIONS, ev.locationId);
  const cam = byId(CAMPUSES, ev.campusId);
  const cat = byId(CATEGORIES, ev.categoryId);
  const ygs = (ev.yearGroupIds||[]).map(id=>{const y=byId(YEAR_GROUPS,id);return y?y.name:'';}).filter(Boolean);
  const descParts = [ev.description||''];
  if(cam) descParts.push(`Campus: ${cam.name}`);
  if(ygs.length) descParts.push(`Year groups: ${ygs.join(', ')}`);
  if(cat) descParts.push(`Category: ${cat.name}`);
  descParts.push('PBIS Central Calendar — panyathip British International School');

  L.push('BEGIN:VEVENT');
  L.push(`UID:${ev.id}@pbis.edu.la`);
  L.push(`DTSTAMP:${T.toUTCStamp(T.todayKey(),'00:00')}`);
  if(ev.allDay){
    const endEx = T.addDays(ev.endDate||ev.date, 1);
    L.push(`DTSTART;VALUE=DATE:${T.toDateStamp(ev.date)}`);
    L.push(`DTEND;VALUE=DATE:${T.toDateStamp(endEx)}`);
  } else {
    L.push(`DTSTART:${T.toUTCStamp(ev.date, ev.start||'08:00')}`);
    L.push(`DTEND:${T.toUTCStamp(ev.endDate||ev.date, ev.end||ev.start||'09:00')}`);
  }
  if(ev.recurrence){
    const r=ev.recurrence; const D=['SU','MO','TU','WE','TH','FR','SA'];
    let rule=`FREQ=${r.freq.toUpperCase()}`;
    if(r.interval&&r.interval>1) rule+=`;INTERVAL=${r.interval}`;
    if(r.byday&&r.byday.length) rule+=`;BYDAY=${r.byday.map(d=>D[d]).join(',')}`;
    if(r.until) rule+=`;UNTIL=${T.toUTCStamp(r.until,'23:59')}`;
    L.push('RRULE:'+rule);
  }
  L.push(`SUMMARY:${icsEscape(ev.title)}`);
  L.push(`DESCRIPTION:${icsEscape(descParts.filter(Boolean).join('\n\n'))}`);
  if(loc) L.push(`LOCATION:${icsEscape(loc.name + (cam? ' — '+cam.name+' Campus':''))}`);
  if(cat) L.push(`CATEGORIES:${icsEscape(cat.name)}`);
  L.push(`STATUS:${ev.status==='cancelled'?'CANCELLED':ev.status==='draft'?'TENTATIVE':'CONFIRMED'}`);
  L.push(`URL:${location.origin}${location.pathname}#/events/${ev.slug}`);
  L.push(`X-PBIS-CAMPUS:${cam?cam.name:'Whole School'}`);
  L.push('END:VEVENT');
  return L;
}
function buildICS(events, calName){
  let L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PBIS//Central Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  L.push(`X-WR-CALNAME:${icsEscape(calName||'PBIS Central Calendar')}`);
  L.push(`X-WR-TIMEZONE:${TZ}`);
  L.push(`X-WR-CALDESC:${icsEscape('Official events from PBIS Central Calendar. One School. Three Campuses. One Shared Calendar.')}`);
  L.push('BEGIN:VTIMEZONE',`TZID:${TZ}`,'BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0700','TZOFFSETTO:+0700','TZNAME:+07','END:STANDARD','END:VTIMEZONE');
  events.forEach(ev=>{ L = L.concat(eventToVEVENT(ev)); });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n');
}
function downloadICS(events, name){
  const ics = buildICS(events, name);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (slugify(name||'pbis-calendar'))+'.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
}
function googleUrl(ev){
  const loc = byId(LOCATIONS, ev.locationId), cam = byId(CAMPUSES, ev.campusId);
  const p = new URLSearchParams();
  p.set('action','TEMPLATE');
  p.set('text', ev.title);
  if(ev.allDay){
    p.set('dates', `${T.toDateStamp(ev.date)}/${T.toDateStamp(T.addDays(ev.endDate||ev.date,1))}`);
  } else {
    p.set('dates', `${T.toUTCStamp(ev.date, ev.start||'08:00')}/${T.toUTCStamp(ev.endDate||ev.date, ev.end||'09:00')}`);
  }
  const details = [ev.description||'', cam?`Campus: ${cam.name}`:'', 'PBIS Central Calendar'].filter(Boolean).join('\n\n');
  p.set('details', details);
  if(loc) p.set('location', loc.name + (cam?` — ${cam.name} Campus, Panyathip British International School`:', Panyathip British International School'));
  p.set('ctz', TZ);
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function outlookUrl(ev){
  const loc = byId(LOCATIONS, ev.locationId);
  const p = new URLSearchParams();
  p.set('path','/calendar/action/compose'); p.set('rru','addevent');
  p.set('subject', ev.title);
  p.set('body', (ev.description||'') + '\n\nPBIS Central Calendar');
  if(loc) p.set('location', loc.name);
  const iso = (d,hm)=>{ const [y,mo,dd]=d.split('-').map(Number); const [h,mi]=(hm||'08:00').split(':').map(Number);
    return new Date(Date.UTC(y,mo-1,dd,h,mi) - TZ_OFFSET_MIN*60000).toISOString(); };
  p.set('startdt', ev.allDay ? ev.date : iso(ev.date, ev.start));
  p.set('enddt', ev.allDay ? T.addDays(ev.endDate||ev.date,1) : iso(ev.endDate||ev.date, ev.end||'09:00'));
  if(ev.allDay) p.set('allday','true');
  return 'https://outlook.live.com/calendar/0/deeplink/compose?'+p.toString();
}
/** Stable webcal-style feed address for a subscription scope. */
function feedUrl(scope){

/* --------------------------------------------------------- CSV EXPORT --- */
function toCSV(events){
  const head = ['Title','Date','End Date','Start','End','All Day','Campus','Year Groups','Category','Audience','Location','Organizer','Status','Visibility','Important','Description'];
  const rows = events.map(ev=>{
    const cam=byId(CAMPUSES,ev.campusId), cat=byId(CATEGORIES,ev.categoryId), loc=byId(LOCATIONS,ev.locationId), org=byId(USERS,ev.organizerId);
    return [ev.title, ev.date, ev.endDate||'', ev.start||'', ev.end||'', ev.allDay?'Yes':'No',
      cam?cam.name:'Whole School',
      (ev.yearGroupIds||[]).map(id=>{const y=byId(YEAR_GROUPS,id);return y?y.name:'';}).join('; '),
      cat?cat.name:'', (ev.audienceIds||[]).map(id=>{const a=byId(AUDIENCES,id);return a?a.name:'';}).join('; '),
      loc?loc.name:'', org?org.name:'', ev.status, ev.visibility, ev.important?'Yes':'No',
      (ev.description||'').replace(/\s+/g,' ').slice(0,300)];
  });
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  return [head.map(q).join(','), ...rows.map(r=>r.map(q).join(','))].join('\r\n');
}
function downloadCSV(events, name){
  const blob = new Blob(['\uFEFF'+toCSV(events)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=slugify(name||'pbis-events')+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

/* ---------------------------------------------------------- CSV PARSE --- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){ /* skip */ }
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

let toastSeq=0;
function toast(msg, opts={}){
  const el = document.createElement('div');
  el.className = 'toast '+(opts.type||'');
  const icon = opts.type==='danger'?I.alert : opts.type==='warning'?I.alert : opts.type==='success'?I.checkCircle : I.info;
  el.innerHTML = `${icon}<div class="msg">${esc(msg)}</div>`;
  if(opts.undo){
    const b=document.createElement('button'); b.className='undo'; b.textContent='Undo';
    b.onclick=()=>{ const label=Store.undo(); el.remove(); if(label) toast('Change reverted',{type:'success'}); };
    el.appendChild(b);
  }
  const close=document.createElement('button'); close.className='undo'; close.setAttribute('aria-label','Dismiss');
  close.innerHTML=I.x; close.style.color='#fff'; close.onclick=()=>el.remove();
  el.appendChild(close);
  const stack = document.getElementById('toasts');
  stack.appendChild(el);
  const id = ++toastSeq;
  setTimeout(()=>{ if(el.isConnected){ el.classList.add('out'); setTimeout(()=>el.remove(),220); } }, opts.undo?7000:4200);
  return id;
}
PBIS.toast=toast;

function copy(text, label){
  const done = ()=> toast((label||'Link')+' copied to clipboard',{type:'success'});
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy automatically — please copy manually',{type:'warning'}); }
    ta.remove();
  }
}

/* --------------------------------------------------------- OVERLAYS ----- */
const Overlay = {
  el:null, lastFocus:null,
  open(html, opts={}){
    this.close(true);
    this.lastFocus = document.activeElement;
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    const host = document.getElementById('overlays');
    host.innerHTML = '';
    host.appendChild(wrap);
    this.el = wrap;
    requestAnimationFrame(()=>{
      wrap.querySelectorAll('.scrim').forEach(s=>s.classList.add('show'));
      wrap.querySelectorAll('.drawer,.modal,.palette').forEach(s=>s.classList.add('show'));
      const focusTarget = wrap.querySelector('[autofocus]') || wrap.querySelector('.drawer,.modal,.palette');
      if(focusTarget) focusTarget.focus({preventScroll:true});
    });
    document.body.style.overflow='hidden';
    this._key = (e)=>{
      if(e.key==='Escape'){ e.preventDefault(); this.close(); }
      if(e.key==='Tab') this.trap(e);
    };
    document.addEventListener('keydown', this._key);
    this.onClose = opts.onClose;
  },
  trap(e){
    if(!this.el) return;
    const f = this.el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    const list = Array.from(f).filter(x=>x.offsetParent!==null);
    if(!list.length) return;
    const first=list[0], last=list[list.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  },
  close(silent){
    if(!this.el) return;
    const el = this.el; this.el=null;
    el.querySelectorAll('.scrim').forEach(s=>s.classList.remove('show'));
    el.querySelectorAll('.drawer,.modal,.palette').forEach(s=>s.classList.remove('show'));
    document.removeEventListener('keydown', this._key);
    document.body.style.overflow='';
    setTimeout(()=>{ if(el.isConnected) el.remove(); }, 300);
    if(!silent && this.lastFocus && this.lastFocus.isConnected) this.lastFocus.focus({preventScroll:true});
    if(this.onClose) { const f=this.onClose; this.onClose=null; f(); }
  }
};
PBIS.Overlay = Overlay;

let paletteState = {q:'', sel:0, items:[]};

function openPalette(){
  paletteState = {q:'', sel:0, items:paletteItems('')};
  Overlay.open(`
    <div class="scrim" data-act="close-overlay"></div>
    <div class="palette-wrap">
      <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
        <div class="palette-input">
          ${I.search}
          <input id="pal-input" autofocus placeholder="Search events, jump to a view, run a command…" aria-label="Search or run a command" autocomplete="off">
          <span class="kbd" style="border-color:var(--border-strong);color:var(--fg-subtle)">ESC</span>
        </div>
        <div class="palette-list" id="pal-list" role="listbox" aria-label="Results"></div>
      </div>
    </div>`);
  setTimeout(()=>{
    const input = document.getElementById('pal-input');
    if(!input) return;
    input.focus();
    renderPalette();
    input.addEventListener('input', e=>{ paletteState.q=e.target.value; paletteState.sel=0; paletteState.items=paletteItems(e.target.value); renderPalette(); });
    input.addEventListener('keydown', e=>{
      const n = paletteState.items.filter(i=>!i.group).length;
      if(e.key==='ArrowDown'){ e.preventDefault(); paletteState.sel=Math.min(paletteState.sel+1,n-1); renderPalette(true); }
      if(e.key==='ArrowUp'){ e.preventDefault(); paletteState.sel=Math.max(paletteState.sel-1,0); renderPalette(true); }
      if(e.key==='Enter'){ e.preventDefault(); runPaletteSel(); }
    });
  },40);
}
PBIS.openPalette = openPalette;

function paletteItems(q){
  const s=q.trim().toLowerCase();
  const nav = [
    {group:'Navigate'},
    {label:'Go to Today', icon:I.calendarCheck, sub:'T', run:()=>{ Store.setUI({cursor:T.todayKey()}); go('/calendar'); }},
    {label:'Open Calendar', icon:I.calendar, run:()=>go('/calendar')},
    {label:'My PBIS Calendar', icon:I.star, run:()=>go('/my')},
    {label:'Important Dates', icon:I.alert, run:()=>go('/dates')},
    {label:'Academic Year Overview', icon:I.layers, run:()=>go('/year')},
    {label:'Subscribe to a calendar', icon:I.rss, run:()=>go('/subscribe')},
    {label:'Digital Signage view', icon:I.monitor, run:()=>go('/signage')},
    {group:'Filter'},
    {label:'Early Years only', icon:I.school, run:()=>{Store.setFilters({campusIds:['ey']}); go('/calendar');}},
    {label:'Primary only', icon:I.school, run:()=>{Store.setFilters({campusIds:['pr']}); go('/calendar');}},
    {label:'Secondary only', icon:I.school, run:()=>{Store.setFilters({campusIds:['se']}); go('/calendar');}},
    {label:'Clear all filters', icon:I.x, run:()=>{Store.setFilters({campusIds:[],yearGroupIds:[],categoryIds:[],audienceIds:[],statuses:[],q:''}); toast('Filters cleared');}},
    {group:'View'},
    {label:'Month view', icon:I.grid, run:()=>{Store.setUI({view:'month'}); go('/calendar');}},
    {label:'Week view', icon:I.table, run:()=>{Store.setUI({view:'week'}); go('/calendar');}},
    {label:'Agenda view', icon:I.list, run:()=>{Store.setUI({view:'agenda'}); go('/calendar');}},
    {label:'Year view', icon:I.layers, run:()=>{Store.setUI({view:'year'}); go('/calendar');}}
  ];
  const admin = Store.can('create') ? [
    {group:'Administration'},
    {label:'Create event', icon:I.plus, sub:'C', run:()=>openEditor(null)},
    {label:'Admin dashboard', icon:I.dashboard, run:()=>go('/admin')},
    {label:'Review submissions', icon:I.inbox, run:()=>go('/admin/submissions')},
    {label:'Import calendar', icon:I.upload, run:()=>go('/admin/import')},
    {label:'Export calendar', icon:I.download, run:()=>go('/admin/export')},
    {label:'Start new academic year', icon:I.refresh, run:()=>go('/admin/rollover')},
    {label:'Audit log', icon:I.history, run:()=>go('/admin/audit')},
    {label:'Settings', icon:I.settings, run:()=>go('/admin/settings')}
  ] : [];
  const base = nav.concat(admin);

  if(!s) return base;

  const filtered = [];
  let currentGroup=null, pushedGroup=false;
  base.forEach(it=>{
    if(it.group){ currentGroup=it; pushedGroup=false; return; }
    if(it.label.toLowerCase().includes(s)){
      if(!pushedGroup && currentGroup){ filtered.push(currentGroup); pushedGroup=true; }
      filtered.push(it);
    }
  });

  const matches = Store.state.events
    .filter(e=>e.status!=='archived' && visibleTo(e, Store.user().role))
    .filter(e=>{
      const loc=byId(LOCATIONS,e.locationId), cam=byId(CAMPUSES,e.campusId);
      return [e.title, e.description, loc&&loc.name, cam&&cam.name, catName(e.categoryId)].join(' ').toLowerCase().includes(s);
    })
    .sort((a,b)=>T.cmp(a.date,b.date))
    .slice(0,8);
  if(matches.length){
    filtered.push({group:'Events'});
    matches.forEach(e=>filtered.push({
      label:e.title, icon:I.calendar, sub:T.fmtMed(e.date),
      run:()=>{ Overlay.close(); setTimeout(()=>openEvent(e.id),120); }
    }));
  }
  if(!filtered.length) filtered.push({group:'No results'});
  return filtered;
}

function renderPalette(scrollOnly){
  const list=document.getElementById('pal-list'); if(!list) return;
  let idx=-1;
  list.innerHTML = paletteState.items.map(it=>{
    if(it.group) return `<div class="palette-group">${esc(it.group)}</div>`;
    idx++;
    return `<button class="palette-item ${idx===paletteState.sel?'sel':''}" data-pi="${idx}" role="option" aria-selected="${idx===paletteState.sel}">
      ${it.icon||I.arrowRight}<span>${esc(it.label)}</span>${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}</button>`;
  }).join('');
  const sel = list.querySelector('.palette-item.sel');
  if(sel) sel.scrollIntoView({block:'nearest'});
  list.querySelectorAll('.palette-item').forEach(b=>{
    b.onclick = ()=>{ paletteState.sel = Number(b.dataset.pi); runPaletteSel(); };
  });
}
function runPaletteSel(){
  const actionable = paletteState.items.filter(i=>!i.group);
  const it = actionable[paletteState.sel];
  if(!it) return;
  Overlay.close();
  setTimeout(()=>it.run(), 80);
}

/* --------------------------------------------------- GLOBAL DISPATCHER -- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  const stop = ()=>{ e.preventDefault(); e.stopPropagation(); };

  switch(act){
    case 'noop': stop(); break;
    case 'close-overlay': stop(); Overlay.close(); break;
    case 'close-overlay-nav': Overlay.close(); break;
    case 'palette': stop(); openPalette(); break;
    case 'mobilenav': stop(); App.mobileNavOpen=!App.mobileNavOpen; render(); break;
    case 'theme': {
      stop();
      const next = Store.state.prefs.theme==='dark'?'light':'dark';
      Store.setPrefs({theme:next}); applyTheme(next); render();
      break;
    }
    case 'motion': {
      stop();
      const next = Store.state.prefs.motion==='off'?'on':'off';
      Store.setPrefs({motion:next}); applyMotion(next); render();
      break;
    }
    case 'open-event': stop(); openEvent(t.dataset.id, t.dataset.date); break;
    case 'edit-event': stop(); Overlay.close(); setTimeout(()=>openEditor(t.dataset.id),140); break;
    case 'ics-event': {
      stop();
      const ev = Store.state.events.find(x=>x.id===t.dataset.id);
      if(ev){ downloadICS([ev], ev.title); toast('Calendar file downloaded',{type:'success'}); }
      break;
    }
    case 'copy-event': stop(); copy(location.origin+location.pathname+'#/events/'+t.dataset.slug, 'Event link'); break;
    case 'copy-text': stop(); copy(t.dataset.text, t.dataset.label||'Link'); break;
    case 'toggle-side': stop(); App.sideOpen=!App.sideOpen; render(); break;
  }
}, false);

/* Keyboard shortcuts */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(Overlay.el) return;
  const r = App.route;
  if(e.key==='/'){ e.preventDefault(); openPalette(); }
  if(r.name==='calendar'||r.name==='home'){
    if(e.key==='t'||e.key==='T'){ Store.setUI({cursor:T.todayKey()}); if(r.name!=='calendar') go('/calendar'); }
    if(e.key==='m'){ Store.setUI({view:'month'}); if(r.name!=='calendar') go('/calendar'); }

    if(r.name==='calendar' && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); shiftCursor(e.key==='ArrowLeft'?-1:1); }

let revealObserver=null;
function bindReveals(){
  if(Store.state.prefs.motion==='off'){ document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); return; }
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver(entries=>{
    entries.forEach((en,i)=>{ if(en.isIntersecting){ en.target.style.transitionDelay=(Math.min(i,6)*45)+'ms'; en.target.classList.add('in'); revealObserver.unobserve(en.target); } });
  },{rootMargin:'0px 0px -8% 0px', threshold:.06});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>revealObserver.observe(el));
}

  const live = !ev.allDay && ev.start && ev.end && o.date===T.todayKey() && nowM>=T.toMin(ev.start) && nowM<=T.toMin(ev.end);
  return `<button class="today-row" style="--cat:${catColour(ev.categoryId)}" data-act="open-event" data-id="${ev.id}" data-date="${o.date}">

/* --------------------------------------------------------- CALENDAR ----- */
function shiftCursor(dir){
  const ui = Store.state.ui;
  const c = ui.cursor;
  let n = c;
  if(ui.view==='month') n = T.addMonths(T.startOfMonth(c), dir);
  else if(ui.view==='week') n = T.addDays(c, 7*dir);
  else if(ui.view==='day') n = T.addDays(c, dir);
  else if(ui.view==='agenda') n = T.addDays(c, 14*dir);
  else if(ui.view==='year') n = T.addMonths(c, 12*dir);
  Store.setUI({cursor:n});
}
PBIS.shiftCursor = shiftCursor;

function calRange(){
  const {view, cursor} = Store.state.ui;
  if(view==='month'){
    const som = T.startOfMonth(cursor);
    return {from:T.addDays(T.startOfWeek(som),0), to:T.addDays(T.startOfWeek(T.endOfMonth(cursor)),6)};
  }
  if(view==='week'){ const s=T.startOfWeek(cursor); return {from:s, to:T.addDays(s,6)}; }
  if(view==='day'){ return {from:cursor, to:cursor}; }
  if(view==='agenda'){ return {from:cursor, to:T.addDays(cursor,44)}; }
  if(view==='year'){ const y=cursor.slice(0,4); return {from:`${y}-01-01`, to:`${y}-12-31`}; }
  return {from:cursor,to:cursor};
}
function calTitle(){
  const {view,cursor}=Store.state.ui;
  if(view==='month') return `${T.monthName(cursor)} ${cursor.slice(0,4)}`;
  if(view==='week'){ const s=T.startOfWeek(cursor), e=T.addDays(s,6);
    return s.slice(0,7)===e.slice(0,7) ? `${T.parse(s).getUTCDate()}–${T.parse(e).getUTCDate()} ${T.monthName(s)} ${s.slice(0,4)}`
      : `${T.fmtShort(s)} – ${T.fmtShort(e)}`; }
  if(view==='day') return T.fmtLong(cursor);
  if(view==='agenda') return `From ${T.fmtShort(cursor)}`;
  if(view==='year') return cursor.slice(0,4);
  return '';
}

function activeFilterStrip(){

  f.campusIds.forEach(id=>tags.push(['campus',id,campusName(id)]));

  f.categoryIds.forEach(id=>tags.push(['cat',id,catName(id)]));
  f.audienceIds.forEach(id=>tags.push(['aud',id,(byId(AUDIENCES,id)||{}).name]));
  if(f.q) tags.push(['q','',`“${f.q}”`]);
  if(!tags.length) return '';
  return `<div class="active-filters">
    <span class="subtle mono" style="font-size:10px;letter-spacing:.1em">FILTERED BY</span>

function monthView(occ){
  const {cursor} = Store.state.ui;
  const {from,to} = calRange();
  const today = T.todayKey();
  const month = cursor.slice(0,7);
  const byDay = {};
  occ.forEach(o=>{ (byDay[o.date]=byDay[o.date]||[]).push(o); });
  const days = T.range(from,to);
  const canDrag = Store.can('edit');

  return `
  <div class="month-head" aria-hidden="true">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="month-grid" role="group" aria-label="Month view — ${T.monthName(cursor)} ${cursor.slice(0,4)}">
    ${days.map(d=>{
      const list=(byDay[d]||[]);
      const holiday = list.some(o=>o.ev.categoryId==='holiday');
      const shown = list.slice(0,4), extra=list.length-shown.length;
      const dn = T.parse(d).getUTCDate();
      return `<div class="day-cell ${d.slice(0,7)!==month?'out':''} ${T.isWeekend(d)?'weekend':''} ${d===today?'is-today':''} ${holiday?'holiday':''}"
        role="group" data-date="${d}" ${canDrag?'data-drop="1"':''} aria-label="${T.fmtLong(d)}, ${list.length} events">
        <div class="day-head">
          <span class="daynum">${dn}</span>
          ${holiday?`<span class="day-tag">${esc((list.find(o=>o.ev.categoryId==='holiday').ev.title||'').slice(0,18))}</span>`:''}
        </div>
        ${shown.map(o=>pill(o,canDrag)).join('')}
        ${extra>0?`<button class="more-link" data-act="day-peek" data-date="${d}">+${extra} more</button>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function pill(o, canDrag){
  const ev=o.ev;
  const cls = [ 'pill',
    ev.allDay?'is-allday':'',
    ev.status==='cancelled'?'is-cancelled':'',
    ev.important?'is-important':'',
    canDrag?'draggable':''
  ].filter(Boolean).join(' ');
  return `<button class="${cls}" style="--cat:${catColour(ev.categoryId)}" data-act="open-event" data-id="${ev.id}" data-date="${o.date}"
    ${canDrag?`draggable="true" data-drag="${ev.id}"`:''} title="${esc(ev.title)} — ${esc(timeLabel(ev))}">
    ${!ev.allDay&&ev.start?`<span class="pt">${esc(ev.start)}</span>`:''}
    <span class="pn">${esc(ev.title)}</span>
  </button>`;
}

/* --- Week / Day --- */
function weekView(occ){ return timeGrid(occ, T.range(T.startOfWeek(Store.state.ui.cursor), T.addDays(T.startOfWeek(Store.state.ui.cursor),6))); }
function dayView(occ){ return timeGrid(occ, [Store.state.ui.cursor]); }

function timeGrid(occ, days){
  const START=7, END=19;
  const today=T.todayKey();
  const allDay = occ.filter(o=>o.ev.allDay);
  const timed = occ.filter(o=>!o.ev.allDay && o.ev.start);
  const hours = []; for(let h=START;h<=END;h++) hours.push(h);

  const minW = days.length>1 ? 'min-width:660px' : '';
  return `
  <div class="tg-scroll">
   <div class="tg" style="${minW}">
    <div class="allday-row">
      <div class="allday-label">All day</div>
      <div style="display:grid;grid-template-columns:repeat(${days.length},minmax(0,1fr))">
        ${days.map(d=>`<div style="padding:4px;border-right:1px solid var(--border);display:grid;gap:2px;align-content:start;min-width:0">
          ${allDay.filter(o=>o.date===d).map(o=>pill(o,false)).join('')}
        </div>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:56px minmax(0,1fr)">
      <div></div>
      <div style="display:grid;grid-template-columns:repeat(${days.length},minmax(0,1fr))">
        ${days.map(d=>`<div class="wk-daycol-head ${d===today?'is-today':''}">
          <div class="wd">${T.DAY3[T.dow(d)]}</div><div class="dn">${T.parse(d).getUTCDate()}</div></div>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:56px minmax(0,1fr)">
    <div class="time-gutter">
      ${hours.map(h=>`<div class="time-slot"><span>${String(h).padStart(2,'0')}:00</span></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(${days.length},minmax(0,1fr));position:relative">
      ${days.map(d=>{
        const items = timed.filter(o=>o.date===d);
        const nowLine = d===today ? nowOffset(START,END) : null;
        return `<div class="day-column ${T.isWeekend(d)?'weekend':''}" data-date="${d}" style="min-height:${(END-START+1)*48}px">
          ${hours.map(()=>`<div class="time-slot"></div>`).join('')}
          ${items.map(o=>{
            const s=T.toMin(o.ev.start), e=T.toMin(o.ev.end||T.fromMin(s+60));
            const top=((s-START*60)/60)*48, h=Math.max(22,((e-s)/60)*48-2);
            return `<button class="tl-event" style="--cat:${catColour(o.ev.categoryId)};top:${top}px;height:${h}px"
              data-act="open-event" data-id="${o.ev.id}" data-date="${o.date}">
              <b>${esc(o.ev.title)}</b><small>${esc(timeLabel(o.ev))}${o.ev.locationId?' · '+esc(locName(o.ev.locationId)):''}</small></button>`;
          }).join('')}
          ${nowLine!==null?`<div class="now-line" style="top:${nowLine}px"></div>`:''}
        </div>`;
      }).join('')}
    </div>
    </div>
   </div>
  </div>`;
}
function nowOffset(START,END){
  const m=T.nowMinutes();
  if(m < START*60 || m > END*60+60) return null;
  return ((m-START*60)/60)*48;
}

/* --- Agenda --- */
function agendaView(occ){
  const groups = {};
  occ.forEach(o=>{ (groups[o.date]=groups[o.date]||[]).push(o); });
  const dates = Object.keys(groups).sort();
  const today=T.todayKey();
  if(!dates.length) return `<div class="empty">${I.calendar}<h4>No events in this range</h4><p>Try clearing filters, or move forward to the next period.</p><button class="btn btn-outline btn-sm mt-3" data-act="clear-filters">Clear filters</button></div>`;
  return `<div class="agenda">
    ${dates.map(d=>{
      const dt=T.parse(d);
      return `<div class="agenda-day">
        <div class="agenda-date ${d===today?'is-today':''}">
          <div class="dow">${T.DAY3[dt.getUTCDay()]}</div>
          <div class="dnum">${dt.getUTCDate()}</div>
          <div class="mon">${T.MON[dt.getUTCMonth()]} ${dt.getUTCFullYear()}</div>
          ${d===today?`<div class="badge badge-gold mt-2">Today</div>`:''}
        </div>
        <div class="agenda-items">
          ${groups[d].map(o=>`
            <button class="agenda-item" style="--cat:${catColour(o.ev.categoryId)}" data-act="open-event" data-id="${o.ev.id}" data-date="${o.date}">
              <span class="at">${o.ev.allDay?'All day':esc(timeLabel(o.ev))}</span>
              <span>
                <span class="an">${esc(o.ev.title)}
                  ${o.ev.important?`<span class="badge badge-important" style="margin-left:6px">${I.star}Important</span>`:''}
                  ${o.ev.status==='cancelled'?`<span class="badge badge-danger" style="margin-left:6px">Cancelled</span>`:''}
                  ${o.spanLen>1?`<span class="badge badge-neutral" style="margin-left:6px">Day ${o.spanIndex+1} of ${o.spanLen}</span>`:''}
                </span>
                <span class="am">
                  <span class="cat-tag" style="--cat:${catColour(o.ev.categoryId)}"><span class="dot"></span>${esc(catName(o.ev.categoryId))}</span>
                  <span>${esc(campusName(o.ev.campusId))}</span>
                  ${o.ev.locationId?`<span>${esc(locName(o.ev.locationId))}</span>`:''}
                  ${o.ev.yearGroupIds&&o.ev.yearGroupIds.length?`<span>${esc(ygLabel(o.ev.yearGroupIds))}</span>`:''}
                </span>
              </span>
            </button>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* --- Year --- */
function yearView(occ){
  const y = Store.state.ui.cursor.slice(0,4);
  const today=T.todayKey();
  const byDay={};
  occ.forEach(o=>{ byDay[o.date]=(byDay[o.date]||0)+1; });
  return `<div class="year-grid">
    ${T.MONTHS.map((mn,mi)=>{
      const first = `${y}-${String(mi+1).padStart(2,'0')}-01`;
      const start = T.startOfWeek(first);
      const end = T.addDays(T.startOfWeek(T.endOfMonth(first)),6);
      const days = T.range(start,end);
      const count = days.filter(d=>d.slice(0,7)===first.slice(0,7)).reduce((a,d)=>a+(byDay[d]||0),0);
      return `<div class="mini-month">
        <h4>${mn}<span>${count} events</span></h4>
        <div class="mini-grid">
          ${['M','T','W','T','F','S','S'].map(d=>`<div class="wd">${d}</div>`).join('')}
          ${days.map(d=>{
            const n=byDay[d]||0;
            return `<button class="mini-day ${d.slice(0,7)!==first.slice(0,7)?'out':''} ${n?'has':''} ${n>2?'busy':''} ${d===today?'today':''}"
              data-act="goto-day" data-date="${d}" title="${T.fmtLong(d)} — ${n} event${n===1?'':'s'}">${T.parse(d).getUTCDate()}</button>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function viewDates(){
  const today=T.todayKey();
  const ay = activeAY();
  const occ = query({from:ay?ay.start:today, to:ay?ay.end:T.addDays(today,365)})
    .filter(o=>o.isStart && o.ev.important && o.ev.status!=='archived');
  const groups={};
  occ.forEach(o=>{ const k=o.date.slice(0,7); (groups[k]=groups[k]||[]).push(o); });
  const keys=Object.keys(groups).sort();
  return `<main id="main">
    <section class="page-hero" style="background:var(--bg-brand);color:#fff;padding:var(--s-16) 0">
      <div class="shell" style="max-width:820px">

        <div class="row mt-8">

        return `<div class="mb-8">
          <div class="row between mb-4" style="align-items:baseline">

                <span><span class="title">${esc(o.ev.title)}</span>

                <span class="right"><span class="badge badge-neutral">${esc(T.relative(o.date))}</span></span>
              </button>`).join('')}

        </div>`;
      }).join('') : emptyCard('No important dates yet')}

/* ------------------------------------------------------ ACADEMIC YEAR --- */
function viewYear(){
  const ay = activeAY();
  const terms = Store.state.terms.filter(t=>t.ayId===ay.id);
  const holidays = Store.state.events.filter(e=>e.categoryId==='holiday' && e.date>=ay.start && e.date<=ay.end && e.status!=='archived').sort((a,b)=>T.cmp(a.date,b.date));

      <div class="sec-head mt-12" style="margin-top:var(--s-16)"><div><h2>Holidays & closures</h2><p>Public holidays, half terms and days when school is closed to students.</p></div></div>
      <div class="card" style="overflow:hidden">
        ${holidays.map((e,i)=>`

/* ----------------------------------------------------------- SIGNAGE ---- */
function viewSignage(){
  const today=T.todayKey();
  const nowM=T.nowMinutes();
  const occ = query({from:today,to:today}).filter(o=>o.ev.status==='published');
  const timed = occ.filter(o=>!o.ev.allDay&&o.ev.start).sort((a,b)=>T.toMin(a.ev.start)-T.toMin(b.ev.start));
  const current = timed.find(o=>nowM>=T.toMin(o.ev.start)&&nowM<=T.toMin(o.ev.end||o.ev.start));
  const next = timed.filter(o=>T.toMin(o.ev.start)>nowM);
  const allDay = occ.filter(o=>o.ev.allDay);
  const upcoming = query({from:T.addDays(today,1),to:T.addDays(today,14)}).filter(o=>o.isStart&&o.ev.status==='published').slice(0,5);

  return `<div class="signage" id="signage-root">
    <div class="signage-head">
      <div>
        <div class="eyebrow" style="color:var(--gold-400)">Panyathip British International School</div>
        <h1>Today at PBIS</h1>
      </div>
      <div class="now">
        <div class="clock" id="sig-clock">${T.nowClock()}</div>
        <div class="date">${T.fmtLong(today)}</div>
      </div>
    </div>
    <div class="signage-body">
      <div style="min-height:0;overflow:hidden">
        ${current?`<div class="sig-now">
          <h3 style="margin-bottom:8px">Happening now</h3>
          <div style="font-size:clamp(1.3rem,2.6vw,2.2rem);font-weight:500;line-height:1.2">${esc(current.ev.title)}</div>
          <div style="color:#B9CFC2;margin-top:8px;font-family:var(--font-mono)">${esc(timeLabel(current.ev))} · ${esc(locName(current.ev.locationId)||campusName(current.ev.campusId))}</div>
        </div>`:''}
        <h3>Today's schedule</h3>
        ${timed.length?timed.map(o=>`<div class="sig-ev">
          <div class="tm">${esc(o.ev.start)}</div>
          <div><div class="nm">${esc(o.ev.title)}</div>
          <div class="lc">${esc(campusName(o.ev.campusId))}${o.ev.locationId?' · '+esc(locName(o.ev.locationId)):''}</div></div>
        </div>`).join(''):`<p style="color:#8FAF9E">No timetabled events today.</p>`}
        ${allDay.length?`<h3 style="margin-top:3vh">All day</h3>${allDay.map(o=>`<div class="sig-ev"><div class="tm">—</div><div><div class="nm">${esc(o.ev.title)}</div></div></div>`).join('')}`:''}
      </div>
      <div style="min-height:0">
        <h3>Coming up</h3>
        ${upcoming.map(o=>`<div class="sig-ev">
          <div class="tm" style="font-size:clamp(.8rem,1.4vw,1.1rem)">${T.fmtNum(o.date).slice(0,5)}</div>
          <div><div class="nm" style="font-size:clamp(.9rem,1.5vw,1.25rem)">${esc(o.ev.title)}</div>
          <div class="lc">${esc(campusName(o.ev.campusId))}</div></div></div>`).join('')}
        <div style="margin-top:auto;padding-top:3vh">
          <div class="eyebrow" style="color:var(--gold-400)">One School. Three Campuses. One Shared Calendar.</div>
        </div>
      </div>
    </div>
    <div style="position:fixed;bottom:12px;right:16px"><a class="btn btn-on-dark btn-sm" href="#/">Exit signage</a></div>
  </div>`;
}

function viewAPI(){
  const endpoints = [
    ['GET','/v1/events','Public','List published, public events. Supports from, to, campus, yearGroup, category, audience, q, limit, cursor.'],
    ['GET','/v1/events/:slug','Public','A single public event by stable slug.'],
    ['GET','/v1/feeds/:scope.ics','Public','Live iCalendar feed for a scope (all, campus, year group, important, holidays, my token).'],
    ['GET','/v1/campuses','Public','Campus entities with year group relationships.'],
    ['GET','/v1/academic-years','Public','Academic years, terms and status.'],
    ['GET','/v1/today','Public','Digital signage payload: current event, next events, all-day notices.'],
    ['GET','/v1/me/calendar','Authenticated','The signed-in user\'s personalised event stream.'],
    ['PUT','/v1/me/preferences','Authenticated','Persist campus, year group, audience and category preferences.'],
    ['POST','/v1/submissions','Authenticated','Submit an event for approval (staff and teachers).'],

    ['POST','/v1/admin/imports','Administrative','Create an import job from CSV, XLSX or ICS; returns a preview for confirmation.'],
    ['GET','/v1/admin/audit','Administrative','Immutable audit trail.']
  ];
  return `<main id="main" class="section"><div class="shell" style="max-width:960px">
    <span class="eyebrow eyebrow-gold">API-first architecture</span>
    <h1 class="display mt-3" style="font-size:clamp(1.9rem,4vw,2.8rem)">Calendar API</h1>

    </p>
    <div class="alert alert-info mt-6">${I.shield}<div class="txt"><b>Four separate layers</b>

  <div class="g2">
    <div class="panel">
      <div class="panel-head"><h3>Quick actions</h3></div>
      <div class="panel-body">
        <div class="opt-grid">
          ${[['new-event','Create event',I.plus],['#/admin/import','Import calendar',I.upload],['#/admin/export','Export calendar',I.download],
             ['#/admin/rollover','New academic year',I.refresh],['#/admin/submissions','Review submissions',I.inbox],['palette','Search everything',I.search]]

function adminEvents(){
  const f = Store.state.ui.filters;
  const tab = AdminState.tab;
  let list = Store.state.events.slice();
  const scoped = Store.scopedCampus();
  if(scoped) list = list.filter(e=>e.campusId===scoped || !e.campusId);
  if(tab!=='all') list = list.filter(e=>e.status===tab);
  else list = list.filter(e=>e.status!=='archived');
  if(f.q) list = list.filter(e=>matchFilters(e,{q:f.q}));
  const {key,dir} = AdminState.sort;
  list.sort((a,b)=>{
    let av,bv;
    if(key==='date'){av=a.date;bv=b.date;}
    else if(key==='title'){av=a.title.toLowerCase();bv=b.title.toLowerCase();}
    else if(key==='campus'){av=campusName(a.campusId);bv=campusName(b.campusId);}
    else if(key==='category'){av=catName(a.categoryId);bv=catName(b.categoryId);}
    else {av=a.status;bv=b.status;}
    return (av<bv?-1:av>bv?1:0)*dir;
  });

  const counts = {
    all:Store.state.events.filter(e=>e.status!=='archived').length,
    published:Store.state.events.filter(e=>e.status==='published').length,
    draft:Store.state.events.filter(e=>e.status==='draft').length,
    cancelled:Store.state.events.filter(e=>e.status==='cancelled').length,
    postponed:Store.state.events.filter(e=>e.status==='postponed').length,
    archived:Store.state.events.filter(e=>e.status==='archived').length
  };
  const sel = AdminState.selected;
  const th = (k,label,w) => `<th class="sortable" data-act="sort" data-key="${k}" ${w?`style="width:${w}"`:''} aria-sort="${key===k?(dir===1?'ascending':'descending'):'none'}">
    ${label}${key===k?(dir===1?' ↑':' ↓'):''}</th>`;

  return `
  <div class="admin-head">
    <div><h2>Events</h2><p>${list.length} event${list.length===1?'':'s'}${scoped?` · scoped to ${esc(campusName(scoped))}`:''}</p></div>
    <div class="row row-tight">
      <div class="searchbox">${I.search}<input class="input" type="search" placeholder="Filter events…" value="${esc(f.q)}" data-act="search-input" aria-label="Filter events"></div>
      <button class="btn btn-outline btn-sm" data-act="export-list">${I.download}Export</button>
      <button class="btn btn-primary btn-sm" data-act="new-event">${I.plus}Create Event</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    ${[['all','All'],['published','Published'],['draft','Drafts'],['cancelled','Cancelled'],['postponed','Postponed'],['archived','Archived']]
      .map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="ev-tab" data-tab="${k}">${l} <span class="mono subtle">${counts[k]}</span></button>`).join('')}
  </div>

  <div class="panel">
    ${sel.size?`<div class="bulkbar">
      <b>${sel.size} selected</b>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="publish">${I.check}Publish</button>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="important">${I.star}Mark important</button>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="cancel">${I.ban}Cancel</button>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="duplicate">${I.copy}Duplicate</button>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="export">${I.download}Export</button>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="archive">${I.trash}Archive</button>
      <div class="grow"></div>
      <button class="btn btn-ghost btn-sm" data-act="bulk" data-op="clear">Clear selection</button>
    </div>`:''}
    <div class="tbl-wrap" tabindex="0" role="region" aria-label="Scrollable table">
      <table class="tbl">
        <thead><tr>
          <th style="width:38px"><input type="checkbox" data-act="sel-all" ${sel.size&&sel.size===list.length?'checked':''} aria-label="Select all events"></th>
          ${th('title','Event')}${th('date','Date','120px')}<th style="width:100px">Time</th>
          ${th('campus','Campus','110px')}<th style="width:130px">Year groups</th>${th('category','Category','120px')}
          ${th('status','Status','110px')}<th style="width:100px">Visibility</th><th style="width:90px"></th>
        </tr></thead>
        <tbody>
          ${list.length?list.map(e=>`<tr class="${sel.has(e.id)?'sel':''}">
            <td><input type="checkbox" data-act="sel-row" data-id="${e.id}" ${sel.has(e.id)?'checked':''} aria-label="Select ${esc(e.title)}"></td>
            <td><span class="nm">${esc(e.title)}</span>
              ${e.important?`<span class="badge badge-important" style="margin-left:6px">${I.star}</span>`:''}
              ${e.recurrence?`<span class="badge badge-neutral" style="margin-left:6px">${I.repeat}</span>`:''}</td>
            <td class="mono">${T.fmtNum(e.date)}${e.endDate?`<div class="subtle" style="font-size:10px">→ ${T.fmtNum(e.endDate)}</div>`:''}</td>
            <td class="mono subtle">${e.allDay?'All day':esc(timeLabel(e))}</td>
            <td>${esc(campusName(e.campusId))}</td>
            <td class="subtle" style="font-size:11.5px">${esc(ygLabel(e.yearGroupIds))}</td>
            <td><span class="cat-tag" style="--cat:${catColour(e.categoryId)}"><span class="dot"></span>${esc(catName(e.categoryId))}</span></td>
            <td><span class="status-dot st-${e.status}">${e.status[0].toUpperCase()+e.status.slice(1)}</span></td>
            <td>${e.visibility==='public'?`<span class="subtle row row-tight" style="gap:4px;font-size:11px">${I.globe}Public</span>`
                 :`<span class="subtle row row-tight" style="gap:4px;font-size:11px">${I.lock}${e.visibility==='internal'?'Internal':'Restricted'}</span>`}</td>
            <td><div class="rowacts">
              <button class="btn btn-ghost btn-icon btn-sm" data-act="open-event" data-id="${e.id}" aria-label="Preview ${esc(e.title)}">${I.eye}</button>
              <button class="btn btn-ghost btn-icon btn-sm" data-act="edit-event-direct" data-id="${e.id}" aria-label="Edit ${esc(e.title)}">${I.edit}</button>
              <button class="btn btn-ghost btn-icon btn-sm" data-act="dup-event" data-id="${e.id}" aria-label="Duplicate ${esc(e.title)}">${I.copy}</button>
            </div></td>
          </tr>`).join('') : `<tr><td colspan="10"><div class="empty">${I.calendar}<h4>No events match</h4><p>Try a different tab or clear the filter.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ---------------------------------------------------- ADMIN ROLLOVER ---- */
function adminRollover(){
  const s = AdminState.rollover;
  const from = Store.state.academicYears.find(a=>a.status==='active');
  const to = Store.state.academicYears.find(a=>a.status==='planning');
  const source = Store.state.events.filter(e=>e.date>=from.start&&e.date<=from.end&&e.status!=='archived');
  const classify = ev => ev.recurrence ? 'recurring' :
    (['holiday','celebration','sports','admissions','graduation'].includes(ev.categoryId) ? 'annual' :
    (['exam','assessment','deadline'].includes(ev.categoryId) ? 'review' : 'onetime'));
  const groups = {recurring:[],annual:[],review:[],onetime:[]};
  source.forEach(e=>groups[classify(e)].push(e));
  const steps=['Create year','Configure terms','Copy events','Import dates','Resolve conflicts','Review & publish'];

  return `<div class="admin-head"><div><h2>Start New Academic Year</h2>
    <p>Roll ${esc(from.name)} forward into ${esc(to.name)} without rebuilding the calendar by hand.</p></div></div>

  <div class="panel"><div class="panel-body">
    <div class="steps mb-5">${steps.map((_,i)=>`<span class="step-dot ${i<=s.step?'done':''}"></span>`).join('')}</div>
    <div class="row between mb-6">
      ${steps.map((t,i)=>`<span class="eyebrow" style="${i===s.step?'color:var(--accent-strong)':''}">${i+1}. ${t}</span>`).join('')}
    </div>

    ${s.step===0?`
      <h3 class="display mb-4" style="font-size:var(--fs-xl)">Create ${esc(to.name)}</h3>
      <div class="g2">
        <div class="field"><label class="label" for="ro-name">Academic year name</label><input class="input" id="ro-name" value="${esc(to.name)}" readonly></div>
        <div class="field"><label class="label" for="ro-status">Status</label><input class="input" id="ro-status" value="Planning" readonly></div>
        <div class="field"><label class="label" for="ro-start">Start date</label><input class="input mono" id="ro-start" type="date" value="${to.start}"></div>
        <div class="field"><label class="label" for="ro-end">End date</label><input class="input mono" id="ro-end" type="date" value="${to.end}"></div>
      </div>
      <div class="alert alert-info mt-5">${I.info}<div class="txt"><b>The active year is not touched</b>
        <span class="body">${esc(from.name)} stays live for families until you publish ${esc(to.name)} and make it active.</span></div></div>
    `:''}

    ${s.step===1?`
      <h3 class="display mb-4" style="font-size:var(--fs-xl)">Configure terms</h3>
      <table class="tbl"><thead><tr><th>Term</th><th style="width:170px">Start</th><th style="width:170px">End</th><th style="width:100px">Weeks</th></tr></thead>
      <tbody>${Store.state.terms.filter(t=>t.ayId===to.id).map(t=>`<tr>
        <td class="nm">${esc(t.name)}</td>
        <td><input class="input mono" type="date" value="${t.start}" aria-label="${esc(t.name)} start date"></td>
        <td><input class="input mono" type="date" value="${t.end}" aria-label="${esc(t.name)} end date"></td>
        <td class="mono">${Math.round((T.diffDays(t.start,t.end)+1)/7)}</td></tr>`).join('')}</tbody></table>
    `:''}

    ${s.step===2?`
      <h3 class="display mb-4" style="font-size:var(--fs-xl)">Copy events forward</h3>
      <p class="muted mb-5">The system has classified last year's ${source.length} events. Dates are not copied blindly — annual and assessment events are held for your review.</p>
      ${[['recurring','Recurring series','Migrate automatically — the pattern is date-independent.','badge-success'],
         ['annual','Annual fixtures','Same event each year on a shifted date. Review the new date.','badge-gold'],
         ['review','Assessment & deadlines','Depend on examination board dates. Must be confirmed manually.','badge-warning'],
         ['onetime','One-time events','Unlikely to repeat. Not copied by default.','badge-neutral']]
        .map(([k,t,d,b])=>`<div class="panel" style="margin-bottom:var(--s-4)">
          <div class="panel-head"><div class="grow"><b>${t}</b> <span class="badge ${b}">${groups[k].length}</span><div class="hint">${d}</div></div>
            <div class="seg"><button aria-pressed="${(s.decisions[k]||(k==='onetime'?'skip':k==='recurring'?'copy':'review'))==='copy'}" data-act="ro-dec" data-k="${k}" data-v="copy">Copy all</button>
            <button aria-pressed="${(s.decisions[k]||(k==='onetime'?'skip':k==='recurring'?'copy':'review'))==='review'}" data-act="ro-dec" data-k="${k}" data-v="review">Review each</button>
            <button aria-pressed="${(s.decisions[k]||(k==='onetime'?'skip':k==='recurring'?'copy':'review'))==='skip'}" data-act="ro-dec" data-k="${k}" data-v="skip">Skip</button></div></div>
          <div class="panel-body flush"><div class="tbl-wrap" tabindex="0" role="region" aria-label="Scrollable table"><table class="tbl" style="min-width:0">
            <tbody>${groups[k].slice(0,4).map(e=>`<tr><td class="nm">${esc(e.title)}</td>
              <td class="mono subtle" style="width:110px">${T.fmtNum(e.date)}</td>
              <td class="mono" style="width:150px;color:var(--accent)">→ ${T.fmtNum(T.addDays(e.date,364))}</td>
              <td style="width:120px">${esc(catName(e.categoryId))}</td></tr>`).join('')}
              ${groups[k].length>4?`<tr><td colspan="4" class="subtle" style="text-align:center">+ ${groups[k].length-4} more</td></tr>`:''}
            </tbody></table></div></div>
        </div>`).join('')}
    `:''}

    ${s.step===3?`
      <h3 class="display mb-4" style="font-size:var(--fs-xl)">Import new dates</h3>
      <p class="muted mb-5">Add dates that are only known for the new year — examination timetables, public holidays and inter-school fixtures.</p>
      <div class="opt-grid">
        <a class="opt" href="#/admin/import"><b>Import a spreadsheet</b><small>CSV or XLSX with the new dates</small></a>
        <button class="opt"><b>Import an ICS feed</b><small>Cambridge examination timetable</small></button>
        <button class="opt"><b>Add manually</b><small>Create events one at a time</small></button>
        <button class="opt"><b>Skip for now</b><small>Add dates later</small></button>
      </div>
    `:''}

    ${s.step===4?`
      <h3 class="display mb-4" style="font-size:var(--fs-xl)">Resolve conflicts</h3>
      ${(()=>{const cf=allConflicts(); return cf.length?cf.slice(0,5).map(c=>`
        <div class="alert alert-warning">${I.alert}<div class="txt">
          <b>${esc(locName(c.locationId))} — ${T.fmtLong(c.date)}</b>
          <span class="body">“${esc(c.a.title)}” (${esc(timeLabel(c.a))}) overlaps “${esc(c.b.title)}” (${esc(timeLabel(c.b))}).</span></div>
          <div class="row row-tight"><button class="btn btn-outline btn-sm" data-act="edit-event-direct" data-id="${c.b.id}">Change time</button>
          <button class="btn btn-ghost btn-sm">Keep anyway</button></div></div>`).join('')
        : `<div class="alert alert-success">${I.checkCircle}<div class="txt"><b>No conflicts detected</b><span class="body">No location is double-booked in the new year.</span></div></div>`;})()}
    `:''}

    ${s.step===5?`
