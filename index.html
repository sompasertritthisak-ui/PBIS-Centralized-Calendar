function bindEditor(){
  document.querySelectorAll('[data-ed]').forEach(el=>{
    const k = el.dataset.ed;
    const handler = ()=>{
      const e=EditorState;
      if(el.type==='checkbox'){
        e[k]=el.checked;
        if(k==='allDay'){ renderEditor(); return; }
        return;
      }
      if(k==='recFreq'){
        const v=el.value;
        if(!v) e.recurrence=null;
        else if(v==='fortnightly') e.recurrence={freq:'weekly',interval:2,byday:[T.dow(e.date)],until:e.recurrence&&e.recurrence.until||''};
        else if(v==='termtime'){ const t=termFor(e.date); e.recurrence={freq:'weekly',interval:1,byday:[T.dow(e.date)],termtime:true,until:t?t.end:''}; }
        else if(v==='weekly') e.recurrence={freq:'weekly',interval:1,byday:[T.dow(e.date)],until:e.recurrence&&e.recurrence.until||''};
        else e.recurrence={freq:v,interval:1,until:e.recurrence&&e.recurrence.until||''};
        renderEditor(); return;
      }
      if(k==='recUntil'){ if(e.recurrence) e.recurrence.until=el.value; return; }
      e[k]=el.value;
      if(k==='campusId'){ e.yearGroupIds=(e.yearGroupIds||[]).filter(y=>{const yg=byId(YEAR_GROUPS,y);return !e.campusId||(yg&&yg.campusId===e.campusId);}); renderEditor(); return; }
      if(k==='locationId'||k==='date'||k==='start'||k==='end'){ renderEditor(); return; }
    };
    el.addEventListener('change', handler);
    if(el.tagName==='INPUT'&&(el.type==='text'||el.type===''||el.type==='search')) el.addEventListener('input', ()=>{EditorState[k]=el.value;});
    if(el.tagName==='TEXTAREA') el.addEventListener('input', ()=>{EditorState[k]=el.value;});
    if(el.id==='ed-title') el.addEventListener('input', ()=>{EditorState.title=el.value;});
  });
}

/* ------------------------------------------------------ SCOPE EXPORTS --- */
function eventsForScope(scope){
  const today=T.todayKey();
  const all = Store.state.events.filter(e=>e.status!=='archived'&&e.status!=='draft'&&visibleTo(e,Store.user().role)&&e.visibility!=='restricted');
  switch(scope){
    case 'all': return all;
    case 'my': return all.filter(e=>matchPersonal(e, Store.state.prefs));
    case 'important': return all.filter(e=>e.important);
    case 'holidays': return all.filter(e=>e.categoryId==='holiday'||/term/i.test(e.title));
    case 'exams': return all.filter(e=>['exam','assessment'].includes(e.categoryId));
    case 'early-years': return all.filter(e=>!e.campusId||e.campusId==='ey');
    case 'primary': return all.filter(e=>!e.campusId||e.campusId==='pr');
    case 'secondary': return all.filter(e=>!e.campusId||e.campusId==='se');
    case 'upcoming': return all.filter(e=>e.date>=today);
    case 'ay': { const a=activeAY(); return all.filter(e=>e.date>=a.start&&e.date<=a.end); }
    case 'campus': return all.filter(e=>e.campusId);
    case 'current': {
      const {from,to}=calRange();
      const ids=new Set(query({from,to}).map(o=>o.ev.id));
      return Store.state.events.filter(e=>ids.has(e.id));
    }
    default: return all;
  }
}
const SCOPE_NAMES = {all:'PBIS — All Events', my:'My PBIS Calendar', important:'PBIS — Important Dates',
  holidays:'PBIS — Term Dates and Holidays', exams:'PBIS — Examinations', 'early-years':'PBIS — Early Years',
  primary:'PBIS — Primary', secondary:'PBIS — Secondary', upcoming:'PBIS — Upcoming', ay:'PBIS — Academic Year',
  campus:'PBIS — By Campus', current:'PBIS — Current View'};

/* -------------------------------------------------------- CSV IMPORT ---- */
const HEADER_MAP = [
  [/^(event\s*)?(name|title|summary)$/i,'title'],
  [/^(start\s*)?date$/i,'date'],
  [/^end\s*date$/i,'endDate'],
  [/^start(\s*time)?$/i,'start'],
  [/^end(\s*time)?$/i,'end'],
  [/^campus$/i,'campusId'],
  [/^year\s*group/i,'yearGroupIds'],
  [/^categor/i,'categoryId'],
  [/^audience/i,'audienceIds'],
  [/^(location|venue|room)$/i,'locationId'],
  [/^(description|notes|details)$/i,'description']
];
function guessTarget(h){ for(const [re,t] of HEADER_MAP) if(re.test(h.trim())) return t; return ''; }

function buildImportPreview(text){
  const rows = parseCSV(text);
  if(rows.length<2){ toast('Not enough rows — the first line must be column headings',{type:'warning'}); return; }
  const headers = rows[0].map(h=>h.trim());
  const map = headers.map(h=>({source:h, target:guessTarget(h)}));
  AdminState.importMap = map;
  AdminState.importRows = rows.slice(1).map(cells=>{
    const data = {title:'',date:'',endDate:'',start:'',end:'',allDay:false,campusId:null,yearGroupIds:[],
      categoryId:'other',audienceIds:['community'],locationId:null,description:''};
    map.forEach((m,i)=>{
      const v=(cells[i]||'').trim(); if(!m.target||!v) return;
      if(m.target==='campusId'){ const c=CAMPUSES.find(x=>x.name.toLowerCase()===v.toLowerCase()||x.short.toLowerCase()===v.toLowerCase()); data.campusId=c?c.id:null; }
      else if(m.target==='categoryId'){ const c=CATEGORIES.find(x=>x.name.toLowerCase()===v.toLowerCase()); data.categoryId=c?c.id:null; }
      else if(m.target==='locationId'){ const l=LOCATIONS.find(x=>x.name.toLowerCase()===v.toLowerCase()); data.locationId=l?l.id:null; data._locRaw=v; }
      else if(m.target==='yearGroupIds'){ data.yearGroupIds=v.split(/[;,]/).map(s=>{const y=YEAR_GROUPS.find(z=>z.name.toLowerCase()===s.trim().toLowerCase());return y?y.id:null;}).filter(Boolean); }
      else if(m.target==='audienceIds'){ data.audienceIds=v.split(/[;,]/).map(s=>{const a=AUDIENCES.find(z=>z.name.toLowerCase()===s.trim().toLowerCase());return a?a.id:null;}).filter(Boolean); }
      else data[m.target]=v;
    });
    if(!data.audienceIds.length) data.audienceIds=['community'];
    if(!data.start && !data.end) data.allDay=true;

    // Smart inference from the title
    if(!data.campusId){
      const t=data.title.toLowerCase();
      const c = CAMPUSES.find(x=>t.includes(x.name.toLowerCase()));
      if(c) data.campusId=c.id;
    }
    if(!data.categoryId){
      const t=data.title.toLowerCase();
      const guess = [['sports day|gala|football|athletic|swim','sports'],['parent evening|parent','parent'],
        ['exam|mock','exam'],['assembly','assembly'],['holiday|closed|break|festival','holiday'],
        ['trip|residential|visit|expedition','trip'],['graduation|leavers','graduation'],
        ['open day|admission|entrance','admissions'],['concert|fair|nativity|celebration|book week','celebration'],
        ['eca|club|activity','eca'],['deadline|due','deadline'],['staff|inset|training','staff'],['meeting','meeting']]
        .find(([re])=>new RegExp(re).test(t));
      data.categoryId = guess?guess[1]:'academic';
    }

    let status='ready', message='';
    if(!data.title){ status='error'; message='Missing event name'; }
    else if(!/^\d{4}-\d{2}-\d{2}$/.test(data.date)){ status='error'; message='Date must be YYYY-MM-DD'; }
    else {
      const dup = Store.state.events.find(e=>e.title.toLowerCase()===data.title.toLowerCase() && e.date===data.date && e.status!=='archived');
      if(dup){ status='duplicate'; message='An identical event already exists on this date'; }
      else {
        const cf = findConflicts(data);
        if(cf.length){ status='conflict'; message=`${locName(data.locationId)} is booked for “${cf[0].event.title}”`; }
        else if(data._locRaw && !data.locationId){ status='warning'; message=`Location “${data._locRaw}” is not a known PBIS location — it will be left blank`; }
        else if(!data.campusId){ status='warning'; message='No campus matched — will be created as a whole-school event'; }
      }
    }
    return {data, status, message, include:status!=='error'};
  });
  render();
  toast(`${AdminState.importRows.length} rows parsed — review before importing`,{type:'success'});
}

/* ------------------------------------------------------ DAY PEEK -------- */
function dayPeek(date){
  const occ = query({from:date,to:date,includeDrafts:true});
  Overlay.open(`
  <div class="scrim" data-act="close-overlay"></div>
  <div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${T.fmtLong(date)}" tabindex="-1">
    <div class="modal-head"><h3>${T.fmtLong(date)}</h3>
      <span class="badge badge-neutral">${occ.length} event${occ.length===1?'':'s'}</span>
      <button class="icon-btn" style="color:var(--fg-muted)" data-act="close-overlay" aria-label="Close">${I.x}</button></div>
    <div class="modal-body" style="padding:var(--s-3)">
      ${occ.map(o=>`<button class="agenda-item mb-2" style="--cat:${catColour(o.ev.categoryId)};width:100%"
        data-act="open-event" data-id="${o.ev.id}" data-date="${o.date}">
        <span class="at">${o.ev.allDay?'All day':esc(timeLabel(o.ev))}</span>
        <span><span class="an">${esc(o.ev.title)}</span>
        <span class="am"><span>${esc(campusName(o.ev.campusId))}</span><span>${esc(catName(o.ev.categoryId))}</span>
        ${o.ev.locationId?`<span>${esc(locName(o.ev.locationId))}</span>`:''}</span></span></button>`).join('')
        || `<div class="empty">${I.calendar}<h4>Nothing scheduled</h4></div>`}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-act="goto-day" data-date="${date}">Open day view</button>
      ${Store.can('create')?`<button class="btn btn-primary" data-act="new-event-on" data-date="${date}">${I.plus}Add event</button>`:''}
    </div>
  </div></div>`);
}

/* --------------------------------------------------- ACTION HANDLERS ---- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const a = t.dataset.act;
  const st = e=>{ e.preventDefault(); e.stopPropagation(); };
  const F = Store.state.ui.filters;
  const toggle = (arr,id)=> arr.includes(id) ? arr.filter(x=>x!==id) : arr.concat([id]);

  switch(a){
    /* --- calendar nav --- */
    case 'cal-prev': st(e); shiftCursor(-1); break;
    case 'cal-next': st(e); shiftCursor(1); break;
    case 'cal-today': st(e); Store.setUI({cursor:T.todayKey()}); break;
    case 'set-view': st(e); Store.setUI({view:t.dataset.view}); break;
    case 'goto-day': st(e); Overlay.close(); Store.setUI({view:'day',cursor:t.dataset.date}); if(App.route.name!=='calendar') go('/calendar'); break;
    case 'day-peek': st(e); dayPeek(t.dataset.date); break;

    /* --- filters --- */
    case 'filter-campus': { st(e); const id=t.dataset.id;
      Store.setFilters({campusIds: id? toggle(F.campusIds,id) : [], yearGroupIds:[]}); App.sideOpen=false; break; }
    case 'filter-yg': { st(e); const id=t.dataset.id; Store.setFilters({yearGroupIds: id? toggle(F.yearGroupIds,id):[]}); break; }
    case 'filter-cat': { st(e); Store.setFilters({categoryIds: toggle(F.categoryIds,t.dataset.id)}); break; }
    case 'filter-aud': { st(e); Store.setFilters({audienceIds: toggle(F.audienceIds,t.dataset.id)}); break; }
    case 'clear-filters': st(e); Store.setFilters({campusIds:[],yearGroupIds:[],categoryIds:[],audienceIds:[],statuses:[],q:''}); break;
    case 'remove-filter': { st(e); const {kind,id}=t.dataset;
      if(kind==='campus') Store.setFilters({campusIds:F.campusIds.filter(x=>x!==id)});
      if(kind==='yg') Store.setFilters({yearGroupIds:F.yearGroupIds.filter(x=>x!==id)});
      if(kind==='cat') Store.setFilters({categoryIds:F.categoryIds.filter(x=>x!==id)});
      if(kind==='aud') Store.setFilters({audienceIds:F.audienceIds.filter(x=>x!==id)});
      if(kind==='q') Store.setFilters({q:''});
      break; }
    case 'campus-cal': st(e); Store.setFilters({campusIds:[t.dataset.id],yearGroupIds:[]}); go('/calendar'); break;
    case 'campus-yg': st(e); Store.setFilters({campusIds:[t.dataset.campus],yearGroupIds:[t.dataset.id]}); go('/calendar'); break;

    /* --- export / subscribe --- */
    case 'ics-scope': { st(e); const s=t.dataset.scope; const list=eventsForScope(s);
      if(!list.length){ toast('Nothing to export in this scope',{type:'warning'}); break; }
      downloadICS(list, SCOPE_NAMES[s]||('PBIS — '+s)); toast(`${list.length} events downloaded as .ics`,{type:'success'}); break; }
    case 'exp': { st(e); const s=t.dataset.scope, f=t.dataset.fmt; const list=eventsForScope(s);
      if(!list.length){ toast('Nothing to export in this scope',{type:'warning'}); break; }
      if(f==='ics') downloadICS(list, SCOPE_NAMES[s]||'PBIS Calendar'); else downloadCSV(list, SCOPE_NAMES[s]||'PBIS Calendar');
      toast(`${list.length} events exported as .${f}`,{type:'success'}); break; }
    case 'export-view': case 'export-list': { st(e); const list=eventsForScope('current');
      downloadICS(list,'PBIS — Current View'); toast(`${list.length} events exported`,{type:'success'}); break; }
    case 'subscribe-view': st(e); go('/subscribe'); break;
    case 'toggle-sub': { st(e); const s=t.dataset.scope; const subs=Store.state.prefs.subscriptions;
      const on=subs.includes(s);
      Store.setPrefs({subscriptions: on? subs.filter(x=>x!==s) : subs.concat([s])});
      toast(on?'Unsubscribed':'Subscribed — copy the feed address into your calendar app',{type:on?'':'success'}); break; }

    /* --- onboarding --- */
    case 'ob-campus': { st(e); App.onboard.campusId=t.dataset.id||null; App.onboard.touchedCampus=true; App.onboard.yearGroupId=null; render(); break; }
    case 'ob-yg': { st(e); App.onboard.yearGroupId=t.dataset.id||null; App.onboard.touchedYg=true; render(); break; }
    case 'ob-aud': { st(e); App.onboard.audienceId=t.dataset.id; render(); break; }
    case 'ob-cat': { st(e); const id=t.dataset.id; App.onboard.categoryIds=toggle(App.onboard.categoryIds,id); render(); break; }
    case 'ob-back': st(e); App.onboard.step=Math.max(0,App.onboard.step-1); render(); break;
    case 'ob-skip': st(e);
      if(App.onboard.step<3){ App.onboard.step++; render(); }
      else { finishOnboarding(); }
      break;
    case 'ob-next': st(e);
      if(App.onboard.step<3){ App.onboard.step++; render(); }
      else finishOnboarding();
      break;
    case 'edit-prefs': st(e); Store.setPrefs({onboarded:false}); App.onboard={step:0,
      campusId:Store.state.prefs.campusId, yearGroupId:Store.state.prefs.yearGroupId,
      audienceId:Store.state.prefs.audienceId, categoryIds:Store.state.prefs.categoryIds.slice()}; render(); break;

    /* --- editor --- */
    case 'new-event': st(e); openEditor(null); break;
    case 'new-event-on': st(e); Overlay.close(); setTimeout(()=>openEditor(null,{date:t.dataset.date}),140); break;
    case 'edit-event-direct': st(e); openEditor(t.dataset.id); break;
    case 'ed-cancel': st(e);
      if(EditorState && EditorState.title && !EditorState._saved){
        confirmDialog({title:'Discard this event?', body:'You have unsaved changes. Closing now will discard them.',
          confirmLabel:'Discard', danger:true, onConfirm:()=>{EditorState=null;}});
      } else { EditorState=null; Overlay.close(); }
      break;
    case 'ed-advanced': st(e); EditorState.advanced=true; renderEditor(); break;
    case 'ed-yg': { st(e); EditorState.yearGroupIds=toggle(EditorState.yearGroupIds||[],t.dataset.id); renderEditor(); break; }
    case 'ed-aud': { st(e); EditorState.audienceIds=toggle(EditorState.audienceIds||[],t.dataset.id); renderEditor(); break; }
    case 'ed-clear-loc': st(e); EditorState.locationId=''; renderEditor(); break;
    case 'ed-ack': st(e); EditorState._ackConflict=true; toast('Conflict acknowledged — the event can be saved',{type:'warning'}); break;
    case 'ed-save-quick': st(e); saveEditor('draft', true); break;
    case 'ed-save': st(e); saveEditor(t.dataset.status); break;
    case 'ed-duplicate': { st(e); const c=JSON.parse(JSON.stringify(EditorState));
      c.id=null; c.slug=null; c.title=c.title+' (copy)'; c.status='draft'; c._saved=false; EditorState=c; renderEditor();
      toast('Duplicated — review and save the copy'); break; }
    case 'ed-delete': { st(e); const id=EditorState.id;
      confirmDialog({title:'Archive this event?', body:'The event is removed from the calendar but kept in the archive with its full history. You can restore it at any time.',
        confirmLabel:'Archive event', danger:true, onConfirm:()=>{ EditorState=null; Store.deleteEvent(id); toast('Event archived',{type:'success',undo:true}); }});
      break; }

    /* --- admin table --- */
    case 'ev-tab': st(e); AdminState.tab=t.dataset.tab; AdminState.selected.clear(); render(); break;
    case 'sub-tab': st(e); AdminState.subTab=t.dataset.tab; render(); break;
    case 'sort': { st(e); const k=t.dataset.key;
      AdminState.sort = AdminState.sort.key===k ? {key:k,dir:-AdminState.sort.dir} : {key:k,dir:1}; render(); break; }
    case 'sel-row': { const id=t.dataset.id;
      if(AdminState.selected.has(id)) AdminState.selected.delete(id); else AdminState.selected.add(id); render(); break; }
    case 'sel-all': {
      if(AdminState.selected.size){ AdminState.selected.clear(); }
      else { document.querySelectorAll('[data-act="sel-row"]').forEach(cb=>AdminState.selected.add(cb.dataset.id)); }
      render(); break; }
    case 'bulk': { st(e); const op=t.dataset.op; const ids=Array.from(AdminState.selected);
      if(op==='clear'){ AdminState.selected.clear(); render(); break; }
      if(!ids.length) break;
      if(op==='publish'){ Store.bulk(ids,{status:'published'},'Published'); toast(`${ids.length} events published`,{type:'success',undo:true}); }
      if(op==='important'){ Store.bulk(ids,{important:true},'Marked important'); toast(`${ids.length} events marked important`,{type:'success',undo:true}); }
      if(op==='cancel'){ Store.bulk(ids,{status:'cancelled'},'Cancelled'); toast(`${ids.length} events cancelled`,{type:'warning',undo:true}); }
      if(op==='archive'){ Store.bulk(ids,{status:'archived'},'Archived'); toast(`${ids.length} events archived`,{type:'success',undo:true}); AdminState.selected.clear(); }
      if(op==='duplicate'){ ids.forEach(id=>{ const src=Store.state.events.find(x=>x.id===id);
          const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.slug=null; c.title=src.title+' (copy)'; c.status='draft'; Store.addEvent(c,true); });
        toast(`${ids.length} events duplicated as drafts`,{type:'success'}); AdminState.selected.clear(); }
      if(op==='export'){ const list=Store.state.events.filter(x=>ids.includes(x.id)); downloadICS(list,'PBIS — Selected Events'); toast(`${ids.length} events exported`,{type:'success'}); }
      render(); break; }
    case 'dup-event': { st(e); const src=Store.state.events.find(x=>x.id===t.dataset.id);
      const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.slug=null; c.title=src.title+' (copy)'; c.status='draft';
      Store.addEvent(c); toast(`“${src.title}” duplicated as a draft`,{type:'success',undo:true}); break; }

    /* --- submissions --- */
    case 'sub-approve': { st(e); const s=Store.state.submissions.find(x=>x.id===t.dataset.id);
      s.status='approved'; s.notes='Approved and published.';
      Store.addEvent({ title:s.title, description:s.description, date:s.date, endDate:s.endDate||null,
        start:s.start||null, end:s.end||null, allDay:!!s.allDay, campusId:s.campusId, yearGroupIds:s.yearGroupIds||[],
        audienceIds:s.audienceIds||['community'], categoryId:s.categoryId, locationId:s.locationId,
        organizerId:s.submittedBy, visibility:'public', status:'published' });
      Store.audit('approved', s.id, s.title);
      toast(`“${s.title}” approved and published`,{type:'success'}); render(); break; }
    case 'sub-reject': { st(e); const s=Store.state.submissions.find(x=>x.id===t.dataset.id);
      confirmDialog({title:'Reject this submission?', body:`“${esc(s.title)}” will be returned to ${esc(userName(s.submittedBy))} as rejected. They can revise and resubmit.`,
        confirmLabel:'Reject', danger:true, onConfirm:()=>{ s.status='rejected'; s.notes='Rejected by '+Store.user().name+'.';
          Store.audit('rejected', s.id, s.title); toast('Submission rejected'); render(); }});
      break; }
    case 'sub-changes': { st(e); const s=Store.state.submissions.find(x=>x.id===t.dataset.id);
      s.status='changes'; s.notes='Changes requested — please add the missing detail and resubmit.';
      Store.audit('updated', s.id, s.title); toast('Changes requested — the submitter has been notified'); render(); break; }

    /* --- import --- */
    case 'imp-sample': st(e); buildImportPreview(SAMPLE_CSV); break;
    case 'imp-parse': { st(e); const ta=document.getElementById('imp-paste');
      if(ta && ta.value.trim()) buildImportPreview(ta.value); else toast('Paste some rows or upload a file first',{type:'warning'}); break; }
    case 'imp-cancel': st(e); AdminState.importRows=null; AdminState.importMap=null; render(); break;
    case 'imp-row': { const i=Number(t.dataset.i); AdminState.importRows[i].include=t.checked; break; }
    case 'imp-toggle-all': { st(e); const anyOn=AdminState.importRows.some(r=>r.include);
      AdminState.importRows.forEach(r=>{ if(r.status!=='error') r.include=!anyOn; }); render(); break; }
    case 'imp-commit': { st(e); const rows=AdminState.importRows.filter(r=>r.include&&r.status!=='error');
      if(!rows.length){ toast('No rows selected to import',{type:'warning'}); break; }
      confirmDialog({title:`Import ${rows.length} events?`, body:`They will be created as <b>drafts</b> so you can review them before families see them. Nothing is published automatically.`,
        confirmLabel:`Import ${rows.length} events`, onConfirm:()=>{
          rows.forEach(r=>Store.addEvent(Object.assign({},r.data,{status:'draft',visibility:'public',important:false,imported:true}),true));
          Store.audit('imported','—',`${rows.length} events imported`);
          AdminState.importRows=null; AdminState.importMap=null;
          toast(`${rows.length} events imported as drafts`,{type:'success'}); render();
        }});
      break; }

    /* --- rollover --- */
    case 'ro-next': st(e);
      if(AdminState.rollover.step<5){ AdminState.rollover.step++; render(); }
      else { toast('Draft academic year 2027–2028 created — events copied as drafts for review',{type:'success'}); AdminState.rollover.step=0; go('/admin/years'); }
      break;
    case 'ro-back': st(e); AdminState.rollover.step=Math.max(0,AdminState.rollover.step-1); render(); break;
    case 'ro-dec': st(e); AdminState.rollover.decisions[t.dataset.k]=t.dataset.v; render(); break;

    /* --- misc admin --- */
    case 'switch-user': { st(e); Store.set({currentUserId:t.dataset.id});
      toast(`Now signed in as ${userName(t.dataset.id)} · ${ROLES[byId(USERS,t.dataset.id).role].name}`,{type:'success'}); break; }
    case 'tax-add': case 'tax-edit': st(e);
      toast('Taxonomy editing is wired to the API in production — the data model already supports it',{type:'info'}); break;
    case 'show-conflicts': { st(e); const cf=allConflicts();
      Overlay.open(`<div class="scrim" data-act="close-overlay"></div><div class="modal-wrap">
        <div class="modal modal-lg" role="dialog" aria-modal="true" aria-label="Scheduling conflicts" tabindex="-1">
        <div class="modal-head"><h3>Potential conflicts</h3><span class="badge badge-warning">${cf.length}</span>
          <button class="icon-btn" style="color:var(--fg-muted)" data-act="close-overlay" aria-label="Close">${I.x}</button></div>
        <div class="modal-body">${cf.map(c=>`<div class="alert alert-warning">${I.alert}<div class="txt">
          <b>${esc(locName(c.locationId))} — ${T.fmtLong(c.date)}</b>
          <span class="body">“${esc(c.a.title)}” ${esc(timeLabel(c.a))} overlaps “${esc(c.b.title)}” ${esc(timeLabel(c.b))}</span></div>
          <button class="btn btn-outline btn-sm" data-act="edit-event-direct" data-id="${c.b.id}">Resolve</button></div>`).join('')
          || `<div class="empty">${I.checkCircle}<h4>No conflicts</h4><p>No location is double-booked.</p></div>`}</div>
        <div class="modal-foot"><button class="btn btn-primary" data-act="close-overlay">Done</button></div></div></div>`);
      break; }
    case 'reset-demo': st(e);
      confirmDialog({title:'Reset demonstration data?', body:'Your preferences and any events you created in this browser will be cleared and the original PBIS sample data restored.',
        confirmLabel:'Reset', danger:true, onConfirm:()=>Store.reset()});
      break;
  }
});

function finishOnboarding(){
  const o=App.onboard;
  Store.setPrefs({onboarded:true, campusId:o.campusId, yearGroupId:o.yearGroupId, audienceId:o.audienceId, categoryIds:o.categoryIds});
  toast('Your PBIS Calendar is ready',{type:'success'});
  render();
}

function saveEditor(status, quick){
  const e = EditorState;
  if(!e.title || !e.title.trim()){ e._err=true; renderEditor(); toast('An event name is required',{type:'danger'});
    setTimeout(()=>{const i=document.getElementById('ed-title'); if(i) i.focus();},100); return; }
  if(!e.date){ toast('A date is required',{type:'danger'}); return; }
  if(!e.allDay && e.start && e.end && T.toMin(e.end)<=T.toMin(e.start)){ toast('The end time must be after the start time',{type:'danger'}); return; }
  if(e.endDate && e.endDate < e.date){ toast('The end date cannot be before the start date',{type:'danger'}); return; }

  const conflicts = findConflicts(e, e.id);
  if(conflicts.length && !e._ackConflict && status==='published'){
    toast('Resolve or acknowledge the location conflict before publishing',{type:'warning'});
    return;
  }

  const payload = {
    title:e.title.trim(), description:e.description||'', date:e.date, endDate:e.endDate||null,
    start:e.allDay?null:(e.start||null), end:e.allDay?null:(e.end||null), allDay:!!e.allDay,
    campusId:e.campusId||null, yearGroupIds:e.yearGroupIds||[], audienceIds:(e.audienceIds&&e.audienceIds.length)?e.audienceIds:['community'],
    categoryId:e.categoryId||'other', locationId:e.locationId||null, organizerId:e.organizerId,
    visibility:e.visibility||'public', status:status||e.status, important:!!e.important,
    recurrence:e.recurrence||null, attachments:e.attachments||[], links:e.links||[], notify:!!e.notify
  };

  e._saved = true;
  if(e.id){
    Store.updateEvent(e.id, payload, status==='published'?'published':'updated');
    toast(`“${payload.title}” saved`,{type:'success',undo:true});
  } else {
    const created = Store.addEvent(payload);
    toast(quick ? `Draft created — add details before publishing` : `“${payload.title}” ${status==='published'?'published':'saved as a draft'}`,
      {type:'success',undo:true});
    if(quick){ EditorState = Object.assign(created,{advanced:true,_saved:false}); renderEditor(); return; }
  }
  if(payload.notify && status==='published'){
    setTimeout(()=>toast(`Notification queued for ${payload.audienceIds.map(a=>(byId(AUDIENCES,a)||{}).name).join(', ')}`,{type:'info'}),900);
  }
  EditorState=null;
  Overlay.close();
  render();
}

/* -------------------------------------------------------- DRAG & DROP --- */
let dragId=null;
document.addEventListener('dragstart', e=>{
  const el=e.target.closest('[data-drag]'); if(!el) return;
  dragId=el.dataset.drag; el.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
});
document.addEventListener('dragend', e=>{ document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); dragId=null; });
document.addEventListener('dragover', e=>{
  const cell=e.target.closest('[data-drop]'); if(!cell||!dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  cell.classList.add('drop-target');
});
document.addEventListener('dragleave', e=>{
  const cell=e.target.closest('[data-drop]'); if(cell) cell.classList.remove('drop-target');
});
document.addEventListener('drop', e=>{
  const cell=e.target.closest('[data-drop]'); if(!cell||!dragId) return;
  e.preventDefault();
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  const newDate = cell.dataset.date;
  const ev = Store.state.events.find(x=>x.id===dragId);
  if(!ev || ev.date===newDate){ dragId=null; return; }
  const shift = T.diffDays(ev.date, newDate);
  const patch = {date:newDate};
  if(ev.endDate) patch.endDate = T.addDays(ev.endDate, shift);
  Store.updateEvent(ev.id, patch, 'moved');
  toast(`“${ev.title}” moved to ${T.fmtMed(newDate)}`,{type:'success',undo:true});
  dragId=null;
});

/* --------------------------------------------------- SEARCH DEBOUNCE ---- */
let searchTimer=null;
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-act="search-input"]'); if(!el) return;
  clearTimeout(searchTimer);
  const v=el.value;
  searchTimer=setTimeout(()=>{
    Store.setFilters({q:v});
    const focused=document.activeElement===el;
    render();
    if(focused){
      const again=document.querySelector('[data-act="search-input"]');
      if(again){ again.focus(); again.setSelectionRange(v.length,v.length); }
    }
  },260);
});
document.addEventListener('change', e=>{
  const el=e.target.closest('[data-act="imp-file"]'); if(!el||!el.files||!el.files[0]) return;
  const f=el.files[0]; const r=new FileReader();
  r.onload=()=>{
    const text=String(r.result||'');
    if(/BEGIN:VCALENDAR/i.test(text)) importICS(text);
    else buildImportPreview(text);
  };
  r.readAsText(f);
});

function importICS(text){
  const blocks = text.split(/BEGIN:VEVENT/i).slice(1);
  const rows = blocks.map(b=>{
    const get = k => { const m=b.match(new RegExp('^'+k+'[^:]*:(.*)$','mi')); return m?m[1].trim():''; };
    const dtRaw = get('DTSTART'); const sumRaw = get('SUMMARY');
    const date = dtRaw.replace(/[TZ].*$/,'').replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
    const timeM = dtRaw.match(/T(\d{2})(\d{2})/);
    const data = {title:sumRaw.replace(/\\,/g,','), date, endDate:'', start:timeM?`${timeM[1]}:${timeM[2]}`:'', end:'',
      allDay:!timeM, campusId:null, yearGroupIds:[], categoryId:'other', audienceIds:['community'],
      locationId:(LOCATIONS.find(l=>l.name.toLowerCase()===get('LOCATION').toLowerCase())||{}).id||null,
      description:get('DESCRIPTION').replace(/\\n/g,'\n')};
    const ok = data.title && /^\d{4}-\d{2}-\d{2}$/.test(data.date);
    return {data, status:ok?'ready':'error', message:ok?'':'Could not read this VEVENT', include:ok};
  });
  AdminState.importMap = [{source:'SUMMARY',target:'title'},{source:'DTSTART',target:'date'},
    {source:'DTEND',target:'end'},{source:'LOCATION',target:'locationId'},{source:'DESCRIPTION',target:'description'}];
  AdminState.importRows = rows;
  render();
  toast(`${rows.length} events read from the ICS file`,{type:'success'});
}

/* ------------------------------------------------------------- RENDER --- */
function render(){
  App.route = parseRoute();
  const r = App.route;
  const root = document.getElementById('app');
  const scrollY = window.scrollY;

  if(r.name==='signage'){
    root.innerHTML = viewSignage();
    startClock();
    return;
  }

  let body;
  switch(r.name){
    case 'home':      body = viewHome(); break;
    case 'calendar':  body = viewCalendar(); break;
    case 'event':     body = viewEventPage(r.slug); break;
    case 'my':        body = viewMy(); break;
    case 'subscribe': body = viewSubscribe(); break;
    case 'dates':     body = viewDates(); break;
    case 'year':      body = viewYear(); break;
    case 'campus':    body = viewCampus(r.slug); break;
    case 'embed':     body = viewEmbed(); break;
    case 'api':       body = viewAPI(); break;
    case 'admin':     body = Store.can('view') ? viewAdmin(r.sub) : notFound('You do not have access to the admin console.'); break;
    default:          body = notFound();
  }
  root.innerHTML = renderMasthead() + body + (r.name==='calendar'||r.name==='my'||r.name==='admin' ? '' : renderFooter());
  document.title = routeTitle(r);
  bindReveals();
  // preserve scroll on in-place updates (filters, tabs) but not on navigation
  if(r.name===App._lastRoute && r.sub===App._lastSub && r.slug===App._lastSlug) window.scrollTo(0, scrollY);
  else window.scrollTo(0,0);
  App._lastRoute=r.name; App._lastSub=r.sub; App._lastSlug=r.slug;

  const st=document.getElementById('side-toggle');
  if(st) st.style.display = window.matchMedia('(max-width:1100px)').matches ? 'inline-flex' : 'none';
  measureSticky();
}
PBIS.render = render;

/* The calendar toolbar can wrap on narrower screens, so the sticky offset for the
   weekday header must be measured rather than assumed. */
function measureSticky(){
  const header = document.querySelector('.masthead');
  const bar = document.querySelector('.cal-bar');
  if(!bar){ document.documentElement.style.removeProperty('--cal-sticky'); return; }
  const strip = document.querySelector('.active-filters');
  const h = (header?header.offsetHeight:64) + bar.offsetHeight + (strip?strip.offsetHeight:0);
  document.documentElement.style.setProperty('--cal-sticky', h+'px');
}
PBIS.measureSticky = measureSticky;

function routeTitle(r){
  const base = 'PBIS Central Calendar';
  const m = {home:base+' — One School. Three Campuses. One Shared Calendar.', calendar:'Calendar · '+base,
    my:'My PBIS Calendar · '+base, subscribe:'Subscribe · '+base, dates:'Important Dates · '+base,
    year:'Academic Year · '+base, signage:'Today at PBIS', embed:'Embed · '+base, api:'API · '+base,
    admin:'Admin Console · '+base};
  if(r.name==='event'){ const e=Store.state.events.find(x=>x.slug===r.slug); return (e?e.title+' · ':'')+base; }
  if(r.name==='campus'){ const c=CAMPUSES.find(x=>x.slug===r.slug); return (c?c.name+' · ':'')+base; }
  return m[r.name]||base;
}

let clockTimer=null;
function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(()=>{
    const el=document.getElementById('sig-clock');
    if(!el){ clearInterval(clockTimer); clockTimer=null; return; }
    el.textContent = T.nowClock();
  }, 15000);
}

/* --------------------------------------------------------------- BOOT --- */
function boot(){
  Store.init();
  Store.subscribe(()=>render());
  window.addEventListener('hashchange', ()=>{ App.mobileNavOpen=false; App.sideOpen=false; Overlay.close(true); render(); });
  let rz=null;
  window.addEventListener('resize', ()=>{
    const st=document.getElementById('side-toggle');
    if(st) st.style.display = window.matchMedia('(max-width:1100px)').matches ? 'inline-flex' : 'none';
    clearTimeout(rz); rz=setTimeout(measureSticky,120);
  });
  if(!location.hash) location.hash = '#/';
  render();
  console.info('%cPBIS Central Calendar','color:#C39A2B;font-weight:700',
    `\nOne School. Three Campuses. One Shared Calendar.\n${Store.state.events.length} canonical events · timezone ${TZ}`);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
